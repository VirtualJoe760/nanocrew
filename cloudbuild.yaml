# Explicit Cloud Build config for the Nano Crew backend image.
#
# WHY NOT `gcloud run deploy --source`: that path does NOT forward --set-build-env-vars into
# Docker `--build-arg`, so the Dockerfile's ARGs stayed empty and `expo export` died with
# "supabaseUrl is required". Building here lets us pass the three EXPO_PUBLIC_* values
# explicitly — they're inlined into the client bundle at export time.
#
# These three values are PUBLIC by design (they ship inside the client bundle — note the key is
# literally the Supabase *publishable* key). Every real secret is injected at RUNTIME as a Cloud
# Run env var instead, and never enters the image.

substitutions:
  _IMAGE: 'us-west1-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/backend:latest'
  _EXPO_PUBLIC_API_URL: ''
  _EXPO_PUBLIC_SUPABASE_URL: ''
  _EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ''

steps:
  - name: 'gcr.io/cloud-builders/docker'
    id: build
    args:
      - 'build'
      - '--build-arg=EXPO_PUBLIC_API_URL=${_EXPO_PUBLIC_API_URL}'
      - '--build-arg=EXPO_PUBLIC_SUPABASE_URL=${_EXPO_PUBLIC_SUPABASE_URL}'
      - '--build-arg=EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY}'
      - '-t'
      - '${_IMAGE}'
      - '.'

images:
  - '${_IMAGE}'

options:
  machineType: 'E2_HIGHCPU_8'   # the Expo web export is heavy; the default machine is slow/OOM-prone
  logging: CLOUD_LOGGING_ONLY

timeout: '2400s'
